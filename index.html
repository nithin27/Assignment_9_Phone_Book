<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phonebook Application</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./Styles/style.css" />
</head>

<body>

  <header class="container">
    <h1>Phonebook</h1>
  </header>

  <div class="container my-4 mb-4">

    <div class="p-4 mb-4 addContactDiv">
      <h4 class="text-dark">Add Contact</h4>
      <!-- Add Contact -->
      <form id="contactForm">
        <input type="hidden" id="contactId">
        <div class="row">
          <div class="col-md-4 mb-4">
            <input type="text" id="Name" class="form-control" placeholder="Name" required>
          </div>

          <div class="col-md-4 mb-4">
            <input type="text" id="phone" class="form-control" placeholder="Phone Number" required>
          </div>
          <!-- Save and cancel button -->
          <div class="col-md-4 mb-4">
            <button class="btn btnSave" type="submit" id="saveBtn">Save Contact</button>
            <button class="btn btnCancel" type="button" id="cancelEdit" style="display:none;">Cancel</button>
          </div>

        </div>

      </form>
    </div>

    <!-- Search Contact -->
    <div class="input-group mb-3">
      <input type="text" id="searchInput" class="form-control" placeholder="Search by name or phone number">
      <button class="btn btnSearch" id="searchBtn">Search</button>
    </div>


    <div class="contactsDiv">
      <H4 class="text-dark">Contacts</H4>
      <!-- Table -->
      <table class="table  text-center">

        <tbody id="contactTable"></tbody>
      </table>
    </div>
  </div>
  <script src="./javaScript/script.js"></script>


</body>

</html>
